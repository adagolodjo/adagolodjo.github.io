
# Site settings
# These are used to personalize your site. Access via {{ site.title }}, {{ site.email }}, etc.
title: Adagolodjo
email: adagolodjo_AT_protonmail.com
description: >-
  Assistant Professor in Computer Science.
  Research in Simulation and Soft Robotics.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://adagolodjo.github.io" # the base hostname & protocol for your site
github_username: adagolodjo
permalink: pretty
excerpt_separator: "<!--more-->"

# Author and social info
author:
  name: Yinoussa Adagolodjo
  linkedin: yinoussa-adagolodjo
  # twitter: your_twitter
  # title_logo: /images/title-logo-image.png

# Theme and plugins
# remote_theme: chrisrhymes/bulma-clean-theme@v0.13.1  # Temporarily disabled due to SSL certificate issues
plugins:
  - jekyll-feed
  - jekyll-email-protect
  - jekyll-inline-svg
  - jekyll-loading-lazy
  - jekyll-scholar
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-toc
  - jekyll-typogrify
  - jemoji
  - liquid_pluralize

# Collections for academic website - Activity-Based Organization
collections:
  pages:
    output: true
    permalink: /:path/
  projects:
    output: true
    permalink: /research/projects/:name/
  publications:
    output: true
    permalink: /research/publications/:name/
  research:
    output: true
    permalink: /research/:path/
  courses:
    output: true
    permalink: /teaching/:name/
  resources:
    output: true
    permalink: /resources/:path/
  professional:
    output: true
    permalink: /professional/:path/
  news:
    output: true
    permalink: /news/:year/:month/:day/:title/

# Default layouts for different content types
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "courses"
    values:
      layout: "course"
  - scope:
      path: ""
      type: "resources"
    values:
      layout: "resource"
  - scope:
      path: ""
      type: "research"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "professional"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "news"
    values:
      layout: "post"

# SASS configuration for theme compatibility
sass:
  style: compressed
  load_paths:
    - assets/css
    - node_modules/bulma

# SEO and social media settings
lang: en
timezone: Europe/Paris

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - 99_archived/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

port: 4002
