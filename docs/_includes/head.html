<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  
  <!-- Basic Meta (fallbacks; jekyll-seo-tag handles full SEO) -->
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
  <meta name="keywords" content="{{ page.keywords | default: 'robotics, medical robotics, augmented reality, healthcare, simulation, soft robotics' }}">
  <meta name="author" content="{{ site.author.name | default: site.title }}">
  
  <!-- Dark Mode CSS Variables -->
  <!-- (Variables et styles globaux désormais dans le SCSS centralisé) -->
  
  <title>{{ page.title | default: site.title }} - {{ site.author.name | default: site.title }}</title>
  
  <!-- Favicon -->
  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="shortcut icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" type="image/x-icon">
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Lato:wght@300;400;700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="{{ "/assets/css/app.css" | relative_url }}">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></noscript>
  {%- feed_meta -%}
  {%- include jsonld.html -%}
  <link rel="preload" href="{{ '/assets/js/home-modern.js' | relative_url }}" as="script">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  
  <!-- Dark Mode Toggle Script -->
  <script>
    function toggleDarkMode() {
      const body = document.body;
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }
    
    // Load saved theme
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
      
      // Add page transition class
      document.body.classList.add('page-transition');
      
      // Navbar scroll effect
      const navbar = document.querySelector('.hero-nav');
      if (navbar) {
        window.addEventListener('scroll', function() {
          if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
          } else {
            navbar.classList.remove('scrolled');
          }
        });
      }
      
      // Smooth scroll for anchor links
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          }
        });
      });
      
      // Animate elements on scroll
      const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      };
      
      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
          }
        });
      }, observerOptions);
      
      // Observe elements for animation
      document.querySelectorAll('.card, .publication-item, .profile-section').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(30px)';
        el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        observer.observe(el);
      });
      
      // Enhanced button hover effects
      document.querySelectorAll('.button').forEach(button => {
        button.addEventListener('mouseenter', function() {
          this.style.transform = 'translateY(-2px)';
        });
        
        button.addEventListener('mouseleave', function() {
          this.style.transform = 'translateY(0)';
        });
      });

      // Lightbulb icon fallback
      const bulb = document.querySelector('.lightbulb-icon');
      if (bulb && !bulb.querySelector('i')) {
        bulb.textContent = '💡';
      }

      // Mobile nav toggle
      const toggle = document.querySelector('.mobile-menu-toggle');
      const mobileNav = document.getElementById('mobile-nav');
      const closeBtn = document.querySelector('.mobile-nav-close');
      const openMenu = () => {
        mobileNav.hidden = false;
        mobileNav.classList.add('is-active');
        toggle.classList.add('is-active');
        toggle.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
      };
      const closeMenu = () => {
        mobileNav.classList.remove('is-active');
        toggle.classList.remove('is-active');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        setTimeout(() => { mobileNav.hidden = true; }, 300);
      };
      if (toggle && mobileNav) {
        toggle.addEventListener('click', () => {
          if (mobileNav.hidden) openMenu(); else closeMenu();
        });
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', closeMenu);
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mobileNav && !mobileNav.hidden) closeMenu();
      });
    });
  </script>
</head>
