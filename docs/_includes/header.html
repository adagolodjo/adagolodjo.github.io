<header class="site-header">
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="container">
      <div class="navbar-brand">
        <a class="navbar-item" href="{{ "/" | relative_url }}">
          <strong>{{ site.title }}</strong>
        </a>

        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasic">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <div id="navbarBasic" class="navbar-menu">
        <div class="navbar-start">
          {% for item in site.data.navigation %}
            {% if item.dropdown %}
              <div class="navbar-item has-dropdown is-hoverable">
                <a class="navbar-link" href="{{ item.link | relative_url }}">
                  {{ item.name }}
                </a>
                <div class="navbar-dropdown">
                  {% for subitem in item.dropdown %}
                    <a class="navbar-item" href="{{ subitem.link | relative_url }}">
                      {{ subitem.name }}
                    </a>
                  {% endfor %}
                </div>
              </div>
            {% else %}
              <a class="navbar-item" href="{{ item.link | relative_url }}">
                {{ item.name }}
              </a>
            {% endif %}
          {% endfor %}
        </div>

        <div class="navbar-end">
          <div class="navbar-item">
            <div class="field has-addons">
              <div class="control">
                <input class="input" type="text" placeholder="Search..." id="searchInput">
              </div>
              <div class="control">
                <button class="button is-primary" onclick="performSearch()" title="Search" aria-label="Search">
                  <span class="icon">
                    <i class="fas fa-search"></i>
                  </span>
                </button>
              </div>
            </div>
          </div>
          
          <div class="navbar-item">
            <button class="button is-outlined" onclick="toggleDarkMode()" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
              <span class="icon">
                <i class="fas fa-moon"></i>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>

<script>
  // Search functionality
  function performSearch() {
    const query = document.getElementById('searchInput').value;
    if (query.trim()) {
      // Simple search - redirect to Google search of the site
      const searchUrl = `https://www.google.com/search?q=site:${window.location.hostname} ${encodeURIComponent(query)}`;
      window.open(searchUrl, '_blank');
    }
  }
  
  // Allow Enter key to trigger search
  document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      performSearch();
    }
  });
  
  // Mobile menu toggle
  document.addEventListener('DOMContentLoaded', function() {
    const burger = document.querySelector('.navbar-burger');
    const menu = document.querySelector('.navbar-menu');
    
    burger.addEventListener('click', function() {
      burger.classList.toggle('is-active');
      menu.classList.toggle('is-active');
    });
  });
</script>
